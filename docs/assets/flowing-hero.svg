<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Flowing 飞序：从一句话到已确认执行</title>
  <desc id="desc">Web、微信和 Telegram 三个入口汇入同一个可确认、可恢复的飞书执行器。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071b2a"/><stop offset="0.52" stop-color="#0d3041"/><stop offset="1" stop-color="#13203b"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#54e3cb"/><stop offset="1" stop-color="#1bb7d4"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#173b50"/><stop offset="1" stop-color="#102d3e"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020b13" flood-opacity=".38"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse"><path d="M56 0H0V56" fill="none" stroke="#8bd4d2" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1600" height="900" rx="36" fill="url(#bg)"/>
  <rect x="24" y="24" width="1552" height="852" rx="28" fill="url(#grid)"/>
  <circle cx="1280" cy="168" r="220" fill="#44d9c3" opacity=".12" filter="url(#soft)"/>
  <circle cx="430" cy="750" r="170" fill="#2677c9" opacity=".12" filter="url(#soft)"/>

  <g font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" fill="#f5fbfb">
    <text x="88" y="98" font-size="22" letter-spacing="4" fill="#77e8d6">FLOWING / 飞序</text>
    <text x="88" y="172" font-size="64" font-weight="700">一句话，流向已完成。</text>
    <text x="90" y="222" font-size="24" fill="#b6ccd4">面向飞书的 AI 工作台：理解目标、读取真实数据、确认关键写入，留下可追溯结果。</text>
    <rect x="90" y="268" width="470" height="94" rx="18" fill="#0b2535" stroke="#3c7886" stroke-opacity=".75"/>
    <text x="120" y="304" font-size="15" fill="#75e6d3">TRY A REQUEST</text>
    <text x="120" y="340" font-size="25" font-weight="600">“找出明天共同空闲的一小时，创建复盘会。”</text>
  </g>

  <!-- entry cards -->
  <g filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="90" y="470" width="260" height="190" rx="22" fill="url(#card)" stroke="#3b6979"/>
    <rect x="378" y="470" width="260" height="190" rx="22" fill="url(#card)" stroke="#3b6979"/>
    <rect x="666" y="470" width="260" height="190" rx="22" fill="url(#card)" stroke="#3b6979"/>
    <g fill="#f5fbfb"><text x="124" y="520" font-size="17" fill="#74e6d4">01 / WEB WORKSPACE</text><text x="124" y="566" font-size="34" font-weight="700">工作台</text><text x="124" y="610" font-size="18" fill="#b6ccd4">聊天 · 计划 · 确认卡片</text></g>
    <g fill="#f5fbfb"><text x="412" y="520" font-size="17" fill="#74e6d4">02 / PRIVATE CHAT</text><text x="412" y="566" font-size="34" font-weight="700">微信</text><text x="412" y="610" font-size="18" fill="#b6ccd4">扫码绑定 · 纯文字私聊</text></g>
    <g fill="#f5fbfb"><text x="700" y="520" font-size="17" fill="#74e6d4">03 / PRIVATE CHAT</text><text x="700" y="566" font-size="34" font-weight="700">Telegram</text><text x="700" y="610" font-size="18" fill="#b6ccd4">BotFather · 长轮询</text></g>
  </g>

  <!-- flow line -->
  <path d="M350 565H1000M638 565H1000M926 565H1000" stroke="url(#glow)" stroke-width="5" fill="none"/>
  <circle cx="1000" cy="565" r="11" fill="#72efda"/>
  <path d="M1000 565C1068 565 1070 450 1135 450M1000 565C1068 565 1070 680 1135 680" stroke="url(#glow)" stroke-width="5" fill="none"/>

  <g filter="url(#shadow)" font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="1135" y="350" width="365" height="214" rx="26" fill="#f6fbfa"/>
    <rect x="1135" y="605" width="365" height="150" rx="26" fill="#f6fbfa"/>
    <rect x="1170" y="389" width="48" height="48" rx="14" fill="url(#glow)"/>
    <text x="1240" y="417" font-size="18" fill="#56717c">LANGGRAPH EXECUTOR</text>
    <text x="1170" y="474" font-size="28" font-weight="700" fill="#0d2d40">发现能力 → 读取 → 确认</text>
    <text x="1170" y="512" font-size="28" font-weight="700" fill="#0d2d40">→ 执行</text>
    <text x="1170" y="544" font-size="18" fill="#56717c">授权中断可恢复 · 结果未知不重放</text>
    <text x="1170" y="655" font-size="18" fill="#56717c">FEISHU / LARK</text>
    <text x="1170" y="696" font-size="24" font-weight="700" fill="#0d2d40">消息 · 日历 · 文档 · 表格</text>
    <text x="1170" y="730" font-size="24" font-weight="700" fill="#0d2d40">任务 · PPT</text>
  </g>
  <text x="90" y="812" font-family="Inter, -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="16" fill="#89aeb8">PERSONAL CHANNELS ARE ACCOUNT-BOUND · WRITE ACTIONS ALWAYS ASK FOR CONFIRMATION</text>
</svg>
