[project]
name = "flowing-backend"
version = "0.1.0"
description = "Standalone FastAPI backend for Lark/Feishu CLI automation."
readme = "../README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "PyYAML>=6.0",
    "openai>=1.12.0",
    "anthropic>=0.18.0",
    "httpx>=0.24.0",
    "typing-extensions>=4.8.0",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
    "jsonschema>=4.23,<5",
    "qrcode>=8.2,<9",
    "cryptography>=46.0.0",
    "python-pptx>=0.6.23",
    "Pillow>=10.0.0",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 120
target-version = "py310"
