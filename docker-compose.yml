services:
  flowing:
    build:
      context: .
      dockerfile: Dockerfile
    image: flowing:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - feishu_cli_data:/app/.feishu_cli_data
    restart: unless-stopped

volumes:
  feishu_cli_data:
    # Keep the previous volume so existing Docker deployments retain their data.
    name: feishu-cli-web_feishu_cli_data
